<!DOCTYPE html>
<!-- 강의 관리자 시제품 · localStorage 회차별 저장 · 실제 서버 연결 지점은 admin-mock.js 주석 참조 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나무쌤 강의 제어판 · 스마트폰 하나로 시작하는 AI생활</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F4F3; --paper:#FFFFFF; --ink:#111111; --sub:#555555; --soft:#F2F2F1;
  --line:rgba(0,0,0,.14); --accent:#F6C744; --alert:#C62828;
  --shadow:0 8px 24px rgba(0,0,0,.10), 0 2px 5px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121212; --paper:#1D1D1D; --ink:#F2F2F2; --sub:#B5B5B5; --soft:#262626;
    --line:rgba(255,255,255,.18); --alert:#FF8A80;
    --shadow:0 8px 24px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.4);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button, input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:60rem;margin:0 auto;padding:1.4rem 1.1rem 3rem}
header.top{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
header.top h1{font-size:1.4rem;font-weight:900}
.demo-badge{display:inline-block;background:var(--accent);color:#111111;border-radius:99px;padding:.15rem .7rem;font-size:.78rem;font-weight:800;margin-left:.4rem;vertical-align:middle}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border-radius:.8rem;box-shadow:var(--shadow);padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.card.wide{grid-column:1/-1}
.card h2{font-size:1.05rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.card .note{font-size:.84rem;color:var(--sub)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:44px;min-width:44px;padding:0 1rem;border-radius:.6rem;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:800;cursor:pointer;text-decoration:none}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* 진행 제어 */
.now{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.now .num{font-size:2.4rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.now .tot{font-size:1.1rem;color:var(--sub);font-weight:700}
.now .ttl{font-size:1.05rem;font-weight:800}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:.4rem}
.jump button{min-height:44px;border-radius:.5rem;border:1.5px solid var(--line);background:var(--paper);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
.jump button:hover{border-color:var(--ink)}
.jump button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jump button.brk{border-style:dashed}

/* 스위치: 글자(ON/OFF)로도 상태 표시 · 색만으로 구분 금지 */
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.3rem 0}
.switchrow p{font-size:.92rem}
.switchrow p b{display:block;font-size:.98rem}
.sw-wrap{display:flex;align-items:center;gap:.5rem;flex:0 0 auto}
.sw-state{font-size:.8rem;font-weight:900;min-width:2.4em;text-align:right}
.switch{position:relative;width:56px;height:32px;border-radius:99px;background:var(--soft);border:2px solid var(--sub);cursor:pointer;flex:0 0 auto}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sub);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{left:27px;background:var(--bg)}
/* 44px 터치 영역 확보 */
.switch::before{content:'';position:absolute;inset:-8px -2px}

/* 타이머 */
.tdisp{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tdisp.warn{color:var(--alert)}
.tstate{font-size:.85rem;font-weight:800;color:var(--sub)}
.preset[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:.92rem}
th, td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:.8rem;color:var(--sub);font-weight:800}
td.txt{white-space:pre-wrap}
td.act{text-align:right;white-space:nowrap}
.stars{letter-spacing:.05em}
.addrow input{flex:1;min-width:8rem;min-height:44px;border:1.5px solid var(--line);border-radius:.5rem;padding:0 .7rem;background:var(--paper)}
.addrow input:focus-visible{border-color:var(--ink)}

#status{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:99px;padding:.5rem 1.1rem;
  font-size:.9rem;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s}
#status.show{opacity:1}

/* 로그인 게이트 */
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.2rem}
#gate form{background:var(--paper);box-shadow:var(--shadow);border-radius:.8rem;padding:1.6rem;width:min(22rem,100%);display:flex;flex-direction:column;gap:.8rem}
#gate h1{font-size:1.2rem;font-weight:900}
#gate label{font-size:.9rem;font-weight:700}
#gate input{min-height:44px;border:1.5px solid var(--line);border-radius:.5rem;padding:0 .7rem;background:var(--paper)}
#gate .warn-box{font-size:.84rem;background:var(--soft);border-left:4px solid var(--ink);border-radius:.4rem;padding:.6rem .8rem}
#gateErr{color:var(--alert);font-size:.88rem;font-weight:700;min-height:1.3em}
[hidden]{display:none!important}

@media (prefers-reduced-motion:reduce){ .switch::after, #status{transition:none} }
</style>
<link rel="stylesheet" href="admin-mock.css">
</head>
<body>
<div id="gate"><form id="gateForm"><h1>강사 로그인 <span class="demo-badge">목업</span></h1><p class="warn-box">스마트폰 하나로 시작하는 AI생활 · 데모 전용 입장</p><label for="pw">비밀번호 · 데모 1234</label><input id="pw" type="password" required autocomplete="off"><p id="gateErr" role="alert"></p><button class="btn" type="submit">입장</button></form></div>
<div class="wrap" id="panel" hidden><header class="top"><h1>나무쌤 강의 제어판 <span class="demo-badge">목업</span></h1><div class="row"><button class="btn ghost" id="resetDemo" type="button">현재 회차 초기화</button><button class="btn ghost" id="logout" type="button">로그아웃</button></div></header><p id="storageNote" class="note"></p><nav class="sticky row" aria-label="빠른 진행"><p id="stickyStatus" role="status"></p><button class="btn" id="stickyPrev" type="button">◀ 이전</button><button class="btn" id="stickyNext" type="button">다음 ▶</button><button class="btn ghost" id="stickyLock" type="button">잠금 전환</button></nav><main class="grid" id="mockCards"></main></div>
<dialog id="qrDialog" aria-labelledby="qrTitle"><h2 id="qrTitle">청중 입장 QR</h2><img src="admin-qr.svg" alt="공개 강의 슬라이드 참여 QR"><p>https://namunamu1013.vercel.app/slides.html</p><button id="qrClose" type="button" class="btn">닫기</button></dialog>
<p id="status" role="status" aria-live="polite"></p>

</body>
</html>
